<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>بوم ميت · لوحة التشغيل</title>
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17110F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Readex+Pro:wght@500;600;700&family=Outfit:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=78">
<script>(function(){var t;try{t=localStorage.getItem('boom-theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
/* splash: shows instantly while the app loads (no black screen) */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0C0C0F;transition:opacity .35s ease,visibility .35s}
[data-theme="light"] #splash{background:#F5F2EE}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:22px}
#splash .sp-logo{width:132px;height:132px;border-radius:32px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px -20px rgba(226,68,43,.65);animation:spPulse 1.6s ease-in-out infinite}
#splash .sp-logo img{width:104px}
#splash .sp-bar{width:120px;height:3px;border-radius:3px;background:rgba(128,128,140,.25);overflow:hidden}
#splash .sp-bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#FF7A45,#D9442B);animation:spBar 1.1s ease-in-out infinite}
#splash.done{opacity:0;visibility:hidden}
@keyframes spPulse{50%{transform:scale(.96)}}
@keyframes spBar{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
@media (prefers-reduced-motion:reduce){#splash .sp-logo,#splash .sp-bar i{animation:none}}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="جاري التحميل"><div class="sp-in"><div class="sp-logo"><img src="boom-logo.png" alt="Boom Meat"></div><div class="sp-bar"><i></i></div></div></div>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="القائمة"></aside>
  <div class="scrim" data-act="menu" aria-hidden="true"></div>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=78"></script>
<script src="i18n.js?v=78"></script>
<script src="engine.js?v=78"></script>
<script src="app.js?v=78"></script>
<script src="pages-ops.js?v=78"></script>
<script src="pages-fin.js?v=78"></script>
<script src="pages-setup.js?v=78"></script>
<script>UI.boot()</script>
</body>
</html>
